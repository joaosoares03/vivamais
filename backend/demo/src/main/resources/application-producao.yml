# Ativar somente pela imagem infra/Dockerfile.producao. ValidadorProducao recusa configuração incompleta.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Railway termina TLS na borda e alcança o serviço por CGNAT. Revisar se o provedor mudar.
      internal-proxies: '100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'
      remote-ip-header: X-Real-IP
      protocol-header: X-Forwarded-Proto
      protocol-header-https-value: https
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
# Contrato OpenAPI só em desenvolvimento e teste, onde o snapshot é gerado. Aqui a rota deixa de existir.
springdoc:
  api-docs:
    enabled: false
