# Ativar somente na imagem infra/Dockerfile.nuvem, com APP_ENV=preview e unidade fictícia explícita.
app:
  web-paciente: true
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Railway termina TLS na borda e alcança o serviço por CGNAT. Não confiar em cabeçalhos de outros pares.
      internal-proxies: '100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'
      remote-ip-header: X-Real-IP
      protocol-header: X-Forwarded-Proto
      protocol-header-https-value: https
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
